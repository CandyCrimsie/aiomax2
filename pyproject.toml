[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "aiomax2"
version = "0.1.0"
description = "An async, aiogram-inspired framework for the MAX Bot API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CandyCrimsie" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.10,<4",
    "pydantic>=2.8,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/CandyCrimsie/aiomax2"
Documentation = "https://candycrimsie.github.io/aiomax2/"
Repository = "https://github.com/CandyCrimsie/aiomax2.git"
Issues = "https://github.com/CandyCrimsie/aiomax2/issues"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.27",
]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiomax2"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["ASYNC109", "B008"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "RUF022"]
"examples/*.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["aiomax2"]
